<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050706">
<title>STONKERS Meme Maker</title>

<style>
*{box-sizing:border-box}

:root{
  --green:#39ff73;
  --bg:#050706;
  --panel:#0a0f0b;
  --panel2:#111713;
  --border:#1c3826;
  --muted:#89928b;
}

body{
  margin:0;
  background:var(--bg);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  text-align:center;
  padding:28px 14px 22px;
  border-bottom:1px solid var(--border);
}

.logo{
  color:var(--green);
  font-weight:900;
  font-size:clamp(34px,9vw,58px);
  letter-spacing:2px;
}

.tagline{
  color:#aaa;
  margin-top:10px;
  font-size:18px;
  letter-spacing:1px;
}

.wrap{
  width:min(760px,100%);
  margin:auto;
  padding:20px 12px 60px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:26px;
  padding:26px;
  margin-bottom:22px;
}

h1{
  color:var(--green);
  font-size:26px;
  margin:0 0 10px;
}

.sub{
  color:#bbb;
  font-size:20px;
  line-height:1.4;
  margin-bottom:22px;
}

.upload{
  display:block;
  width:100%;
  background:var(--green);
  color:#071009;
  text-align:center;
  font-weight:900;
  font-size:18px;
  padding:20px;
  border-radius:18px;
  cursor:pointer;
  border:none;
}

#upload{
  display:none;
}

.section-title{
  margin:28px 0 14px;
  color:#aaa;
  font-weight:900;
  font-size:15px;
}

.templates{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.template{
  position:relative;
  overflow:hidden;
  aspect-ratio:1/1;
  border:1px dashed #31533b;
  border-radius:18px;
  background:#0d130f;
  cursor:pointer;
  padding:0;
}

.template img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.template span{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:18px 5px 8px;
  text-align:center;
  font-size:11px;
  font-weight:900;
  color:white;
  background:linear-gradient(transparent,rgba(0,0,0,.9));
}

.template.active{
  outline:2px solid var(--green);
  border-color:var(--green);
}

.ratios{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.ratio{
  border:1px solid #29332c;
  background:#171d19;
  color:white;
  border-radius:17px;
  padding:18px 6px;
  font-weight:900;
  font-size:16px;
}

.ratio.active{
  background:var(--green);
  color:#071009;
}

.canvas-wrap{
  width:100%;
  border:1px solid #26352b;
  border-radius:22px;
  overflow:hidden;
  background:#000;
  touch-action:none;
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:#000;
  touch-action:none;
}

.hint{
  text-align:center;
  color:#8d958f;
  margin:12px 0 0;
  font-size:14px;
}

.controls{
  margin-top:22px;
}

label.control-label{
  display:block;
  color:#aeb5b0;
  font-size:13px;
  font-weight:900;
  margin:15px 0 7px;
}

input[type="text"]{
  width:100%;
  background:#111713;
  border:1px solid #29352d;
  color:white;
  border-radius:13px;
  padding:15px;
  font-size:16px;
}

input[type="range"]{
  width:100%;
  accent-color:var(--green);
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  font-family:inherit;
}

.action{
  width:100%;
  border:none;
  border-radius:15px;
  padding:16px 10px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.green{
  background:var(--green);
  color:#061008;
}

.dark{
  background:#171d19;
  color:white;
  border:1px solid #2b352e;
}

.small-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.footer{
  text-align:center;
  color:#667069;
  font-size:12px;
  padding-top:10px;
}

@media(max-width:520px){
  .card{padding:20px 14px}
  .templates{gap:9px}
  .template span{font-size:9px}
  .tagline{font-size:15px}
}
</style>
</head>

<body>

<header>
  <div class="logo">STONKERS 🪖</div>
  <div class="tagline">THE INTERNET'S WALL STREET</div>
</header>

<main class="wrap">

<section class="card">

<h1>STONKERS MEME MAKER</h1>

<div class="sub">
Wall Street has Bloomberg.<br>
We have this. 😂📈
</div>

<label class="upload" for="upload">
📷 UPLOAD YOUR IMAGE
</label>

<input id="upload" type="file" accept="image/*">

<div class="section-title">OFFICIAL STONKERS TEMPLATES</div>

<div class="templates">

<button class="template" data-src="stonker-zero.png">
<img src="stonker-zero.png" alt="Stonker Zero">
<span>STONKER ZERO</span>
</button>

<button class="template" data-src="wall-street.png">
<img src="wall-street.png" alt="Wall Street">
<span>WALL STREET</span>
</button>

<button class="template" data-src="the-trenches.png">
<img src="the-trenches.png" alt="The Trenches">
<span>THE TRENCHES</span>
</button>

<button class="template" data-src="emergency.png">
<img src="emergency.png" alt="Emergency">
<span>EMERGENCY</span>
</button>

<button class="template" data-src="rekt.png">
<img src="rekt.png" alt="Rekt">
<span>REKT</span>
</button>

<button class="template" data-src="bull-mode.png">
<img src="bull-mode.png" alt="Bull Mode">
<span>BULL MODE</span>
</button>

</div>
</section>

<section class="card">

<div class="ratios">

<button class="ratio active" data-ratio="square">
⬜<br>SQUARE
</button>

<button class="ratio" data-ratio="portrait">
▯<br>PORTRAIT
</button>

<button class="ratio" data-ratio="wide">
▭<br>WIDE
</button>

</div>

<div class="canvas-wrap">
<canvas id="canvas" width="1080" height="1080"></canvas>
</div>

<div class="hint">
Drag the image to reposition it • Use the zoom control below
</div>

<div class="controls">

<label class="control-label">IMAGE ZOOM</label>
<input id="zoom" type="range" min="0.5" max="3" value="1" step="0.01">

<label class="control-label">TOP TEXT</label>
<input id="topText" type="text" placeholder="WHEN YOU BUY THE DIP...">

<label class="control-label">BOTTOM TEXT</label>
<input id="bottomText" type="text" placeholder="...AND IT KEEPS DIPPING">

<label class="control-label">TEXT SIZE</label>
<input id="fontSize" type="range" min="28" max="110" value="68">

<div class="small-actions">

<button id="undo" class="action dark">
↶ UNDO
</button>

<button id="reset" class="action dark">
↻ RESET
</button>

</div>

<div style="margin-top:12px">

<button id="save" class="action green">
⬇ SAVE MEME
</button>

</div>

</div>
</section>

<div class="footer">
STONKERS ARMY 🪖 • $STNKS<br><br>
Built From Zero • No Surrender • No Retreat
</div>

</main>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const upload = document.getElementById("upload");
const zoom = document.getElementById("zoom");
const topText = document.getElementById("topText");
const bottomText = document.getElementById("bottomText");
const fontSize = document.getElementById("fontSize");

const saveBtn = document.getElementById("save");
const resetBtn = document.getElementById("reset");
const undoBtn = document.getElementById("undo");

let bg = null;

let bgX = 0;
let bgY = 0;
let bgZoom = 1;

let dragging = false;
let lastX = 0;
let lastY = 0;

let history = [];

const ratios = {
  square:[1080,1080],
  portrait:[1080,1350],
  wide:[1200,675]
};

function drawPlaceholder(){

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.textAlign="center";

  ctx.fillStyle="#39ff73";
  ctx.font="bold 58px Arial";
  ctx.fillText(
    "STONKERS",
    canvas.width/2,
    canvas.height/2-30
  );

  ctx.fillStyle="#ddd";
  ctx.font="28px Arial";
  ctx.fillText(
    "CHOOSE AN IMAGE TO START",
    canvas.width/2,
    canvas.height/2+25
  );

  ctx.fillStyle="#555";
  ctx.font="20px Arial";
  ctx.fillText(
    "Built From Zero 🪖",
    canvas.width/2,
    canvas.height/2+70
  );

  watermark();
}

function coverScale(img){

  const base = Math.max(
    canvas.width/img.width,
    canvas.height/img.height
  );

  return base * bgZoom;
}

function drawImage(){

  if(!bg){
    drawPlaceholder();
    return;
  }

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const scale = coverScale(bg);

  const w = bg.width * scale;
  const h = bg.height * scale;

  const x = (canvas.width-w)/2 + bgX;
  const y = (canvas.height-h)/2 + bgY;

  ctx.drawImage(bg,x,y,w,h);
}

function wrapText(text,maxWidth){

  const words = text.split(" ");
  const lines = [];

  let line="";

  for(const word of words){

    const test = line
      ? line+" "+word
      : word;

    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line=word;
    }else{
      line=test;
    }
  }

  if(line) lines.push(line);

  return lines;
}

function drawMemeText(text,position){

  if(!text.trim()) return;

  const size = Number(fontSize.value);

  ctx.font=`900 ${size}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.lineJoin="round";

  const lines = wrapText(
    text.toUpperCase(),
    canvas.width*0.88
  );

  const lineHeight=size*1.08;

  let startY;

  if(position==="top"){
    startY=70;
  }else{
    startY=
      canvas.height -
      70 -
      (lines.length-1)*lineHeight;
  }

  lines.forEach((line,i)=>{

    const y=startY+i*lineHeight;

    ctx.strokeStyle="#000";
    ctx.lineWidth=Math.max(8,size*.13);
    ctx.strokeText(line,canvas.width/2,y);

    ctx.fillStyle="#fff";
    ctx.fillText(line,canvas.width/2,y);

  });
}

function watermark(){

  ctx.textAlign="right";
  ctx.textBaseline="bottom";

  ctx.font="900 22px Arial";

  ctx.strokeStyle="#000";
  ctx.lineWidth=5;

  ctx.strokeText(
    "STONKERS 🪖",
    canvas.width-20,
    canvas.height-16
  );

  ctx.fillStyle="#39ff73";

  ctx.fillText(
    "STONKERS 🪖",
    canvas.width-20,
    canvas.height-16
  );
}

function draw(){

  drawImage();

  drawMemeText(
    topText.value,
    "top"
  );

  drawMemeText(
    bottomText.value,
    "bottom"
  );

  if(bg) watermark();
}

function loadImage(src){

  const img=new Image();

  img.onload=()=>{

    bg=img;

    bgX=0;
    bgY=0;
    bgZoom=1;

    zoom.value=1;

    snapshot();
    draw();
  };

  img.onerror=()=>{
    alert(
      "Template image could not load. Check the filename in GitHub."
    );
  };

  img.src=src+"?v="+Date.now();
}

document
.querySelectorAll(".template")
.forEach(button=>{

  button.addEventListener("click",()=>{

    document
    .querySelectorAll(".template")
    .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    loadImage(
      button.dataset.src
    );

  });

});

upload.addEventListener("change",e=>{

  const file=e.target.files[0];

  if(!file) return;

  const reader=new FileReader();

  reader.onload=event=>{

    const img=new Image();

    img.onload=()=>{

      bg=img;

      bgX=0;
      bgY=0;
      bgZoom=1;

      zoom.value=1;

      document
      .querySelectorAll(".template")
      .forEach(b=>b.classList.remove("active"));

      snapshot();
      draw();
    };

    img.src=event.target.result;
  };

  reader.readAsDataURL(file);
});

document
.querySelectorAll(".ratio")
.forEach(button=>{

  button.addEventListener("click",()=>{

    const [w,h]=ratios[
      button.dataset.ratio
    ];

    canvas.width=w;
    canvas.height=h;

    bgX=0;
    bgY=0;

    document
    .querySelectorAll(".ratio")
    .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    snapshot();
    draw();

  });

});

zoom.addEventListener("input",()=>{

  bgZoom=Number(zoom.value);
  draw();

});

zoom.addEventListener("change",snapshot);

topText.addEventListener(
  "input",
  draw
);

bottomText.addEventListener(
  "input",
  draw
);

fontSize.addEventListener(
  "input",
  draw
);

topText.addEventListener(
  "change",
  snapshot
);

bottomText.addEventListener(
  "change",
  snapshot
);

fontSize.addEventListener(
  "change",
  snapshot
);

function pointerPosition(e){

  const rect=
    canvas.getBoundingClientRect();

  let clientX;
  let clientY;

  if(e.touches){
    clientX=e.touches[0].clientX;
    clientY=e.touches[0].clientY;
  }else{
    clientX=e.clientX;
    clientY=e.clientY;
  }

  return{
    x:(clientX-rect.left)*
      canvas.width/rect.width,

    y:(clientY-rect.top)*
      canvas.height/rect.height
  };
}

function pointerDown(e){

  if(!bg) return;

  e.preventDefault();

  dragging=true;

  const p=pointerPosition(e);

  lastX=p.x;
  lastY=p.y;
}

function pointerMove(e){

  if(!dragging || !bg) return;

  e.preventDefault();

  const p=pointerPosition(e);

  bgX+=p.x-lastX;
  bgY+=p.y-lastY;

  lastX=p.x;
  lastY=p.y;

  draw();
}

function pointerUp(){

  if(dragging){
    dragging=false;
    snapshot();
  }
}

canvas.addEventListener(
  "mousedown",
  pointerDown
);

canvas.addEventListener(
  "mousemove",
  pointerMove
);

window.addEventListener(
  "mouseup",
  pointerUp
);

canvas.addEventListener(
  "touchstart",
  pointerDown,
  {passive:false}
);

canvas.addEventListener(
  "touchmove",
  pointerMove,
  {passive:false}
);

window.addEventListener(
  "touchend",
  pointerUp
);

function currentState(){

  return{
    bg,
    bgX,
    bgY,
    bgZoom,
    top:topText.value,
    bottom:bottomText.value,
    font:Number(fontSize.value),
    width:canvas.width,
    height:canvas.height
  };
}

function snapshot(){

  const state=currentState();

  history.push(state);

  if(history.length>30){
    history.shift();
  }
}

undoBtn.addEventListener("click",()=>{

  if(history.length<=1) return;

  history.pop();

  const state=
    history[history.length-1];

  bg=state.bg;

  bgX=state.bgX;
  bgY=state.bgY;
  bgZoom=state.bgZoom;

  zoom.value=state.bgZoom;

  topText.value=state.top;
  bottomText.value=state.bottom;

  fontSize.value=state.font;

  canvas.width=state.width;
  canvas.height=state.height;

  document
  .querySelectorAll(".ratio")
  .forEach(b=>b.classList.remove("active"));

  if(
    canvas.width===1080 &&
    canvas.height===1080
  ){
    document
    .querySelector(
      '[data-ratio="square"]'
    ).classList.add("active");
  }

  if(
    canvas.width===1080 &&
    canvas.height===1350
  ){
    document
    .querySelector(
      '[data-ratio="portrait"]'
    ).classList.add("active");
  }

  if(
    canvas.width===1200 &&
    canvas.height===675
  ){
    document
    .querySelector(
      '[data-ratio="wide"]'
    ).classList.add("active");
  }

  draw();
});

resetBtn.addEventListener("click",()=>{

  bg=null;

  bgX=0;
  bgY=0;
  bgZoom=1;

  zoom.value=1;

  topText.value="";
  bottomText.value="";
  fontSize.value=68;

  canvas.width=1080;
  canvas.height=1080;

  upload.value="";

  document
  .querySelectorAll(".template")
  .forEach(
    b=>b.classList.remove("active")
  );

  document
  .querySelectorAll(".ratio")
  .forEach(
    b=>b.classList.remove("active")
  );

  document
  .querySelector(
    '[data-ratio="square"]'
  ).classList.add("active");

  history=[];

  draw();
  snapshot();
});

saveBtn.addEventListener("click",()=>{

  if(!bg){
    alert(
      "Choose a STONKERS template or upload an image first."
    );
    return;
  }

  draw();

  const link=
    document.createElement("a");

  link.download=
    "stonkers-meme.png";

  link.href=
    canvas.toDataURL("image/png");

  link.click();
});

draw();
snapshot();
</script>

</body>
</html>
